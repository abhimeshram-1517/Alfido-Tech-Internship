{% extends "base.html" %}

{% block title %}Edit Student | Student Manager{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4 p-md-5">

                <h2 class="fw-bold mb-2">Edit Student</h2>

                <p class="text-secondary mb-4">
                    Update the student's information.
                </p>

                <form method="POST"
                      action="{{ url_for('edit_student', student_id=student.id) }}">

                    <div class="mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ student.name }}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               value="{{ student.email }}"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Course
                        </label>

                        <select name="course"
                                class="form-select"
                                required>

                            {% for course in [
                                'Python Full Stack',
                                'Web Development',
                                'Data Science',
                                'Artificial Intelligence',
                                'Cloud Computing'
                            ] %}

                                <option value="{{ course }}"
                                    {% if student.course == course %}
                                        selected
                                    {% endif %}>
                                    {{ course }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Update Student
                    </button>

                    <a href="{{ url_for('index') }}"
                       class="btn btn-light w-100 mt-2">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
